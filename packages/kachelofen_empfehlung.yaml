# =====================================================================
# Kachelofen: Prognose & Holz-Empfehlungen
# Separates Home-Assistant-Paket - ausgelagert aus kachelofen.yaml
# Enthaelt: Prognose Raumtemp 07:00, Morgenempfehlung, Wetter-Vorhersage
# Nacht/Tag, Holz-Empfehlungen (kalibriert/gelernt/lernend/Basis), 19:00-Empfehlung
# =====================================================================

template:
  # =====================================================================
  # 11. PROGNOSE RAUMTEMPERATUR MORGEN 07:00
  # =====================================================================
  - trigger:
      - platform: state
        entity_id: binary_sensor.kachelofen_zahler_ofen_brennt
        from: "off"
        to: "on"
      - platform: time_pattern
        minutes: "/15"
    sensor:
      - name: "Prognose Raumtemperatur Morgen 07"
        unique_id: prognose_raumtemp_morgen
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:weather-sunset
        availability: >-
          {{ has_value('sensor.greenhouse_temperatur')
             and has_value('sensor.vorhersage_nacht_mittel')
             and has_value('binary_sensor.kachelofen_zahler_ofen_brennt') }}
        state: >
          {% if trigger.entity_id is defined and 'ofen_brennt' in trigger.entity_id %}
            {% set t_start = state_attr('sensor.wohnzimmer_temp_puffer', 'temp_vor_90min') | float(states('sensor.greenhouse_temperatur') | float(20)) %}
          {% else %}
            {% set t_start = (this.attributes.t_start | default(states('sensor.raumtemperatur_vor_abbrand') | float(20))) | float(20) %}
          {% endif %}
          {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
          {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
          {% set lw = [lw, 0.6] | min %}
          {% set C = 40 %}  # effektive Waermekapazitaet Raum+Gebaeude in kWh/K (realistisch ~30-60, NICHT 4*lw)
          {% set rate = states('sensor.wohnzimmer_abkuehlrate') | float(0) %}
          {% set dt_now = [states('sensor.greenhouse_temperatur') | float(20) - states('sensor.gw3000a_outdoor_temperature') | float(5), 1] | max %}
          {% set G = ([rate | abs / dt_now, 0.1] | max) if rate < 0 else (lw * 4 / 12) %}
          {% set wind = states('sensor.gw3000a_wind_speed') | float(0) %}
          {% set G = G * (1 + wind / 100) %}
          {% set t_out = states('sensor.vorhersage_nacht_mittel') | float(states('sensor.gw3000a_outdoor_temperature') | float(5)) + states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
          {% set menge = states('input_number.kamin_holzmenge') | float(0) %}
          {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
          {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
          {% set e_holz = menge * hw %}
          {% set e_speicher = states('sensor.kachelofen_speicherenergie') | float(0) %}
          {% set e_total = e_holz + e_speicher %}
          {% set h = ((7 - now().hour - now().minute / 60) % 24) %}
          {% set h = [h, 1] | max %}
          {% set P = e_total / h %}
          {% set t_eq = t_out + P / G %}
          {% set tau = C / G %}
          {% set t_07 = t_eq + (t_start - t_eq) * 2.71828 ** (-(h / tau)) %}
          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
          {{ [t_07, ziel + 5] | min | round(1) }}
        attributes:
          t_start: >
            {% if trigger.entity_id is defined and 'ofen_brennt' in trigger.entity_id %}
              {{ state_attr('sensor.wohnzimmer_temp_puffer', 'temp_vor_90min') | float(states('sensor.greenhouse_temperatur') | float(20)) | round(1) }}
            {% else %}
              {{ this.attributes.t_start | float(states('sensor.raumtemperatur_vor_abbrand') | float(20)) }}
            {% endif %}
          energie_holz: "{{ states('input_number.kamin_holzmenge') | float(0) * 4 }} kWh"
          energie_speicher: "{{ states('sensor.kachelofen_speicherenergie') }} kWh"
          nacht_aussentemperatur: "{{ (states('sensor.vorhersage_nacht_mittel') | float(0) + states('sensor.vorhersagefehler_letzte_nacht') | float(0)) | round(1) }} °C"
          stunden_bis_7: "{{ [((7 - now().hour - now().minute / 60) % 24), 1] | max | round(1) }} h"

  # =====================================================================
  # 11b. PROGNOSE RAUMTEMP 19 UHR (ERSTELLT 07:05, SZENARIO: KEIN WEITERER ABBRAND)
  # =====================================================================
  - trigger:
      - platform: time
        at: "07:05:00"
    sensor:
      - name: "Prognose Raumtemp 19 Uhr vom Morgen"
        unique_id: prognose_raumtemp_19_uhr_vom_morgen
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:weather-sunset-down
        availability: >-
          {{ has_value('sensor.greenhouse_temperatur')
             and has_value('sensor.kachelofen_speicherenergie') }}
        state: >-
          {% set t_start = states('sensor.greenhouse_temperatur') | float(20) %}
          {% set t_out = states('sensor.vorhersage_bis_19_uhr_mittel') | float(states('sensor.vorhersage_tag_mittel') | float(5)) + states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
          {% set h = 12 %}
          {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
          {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
          {% set lw = [lw, 0.6] | min %}
          {% set rate_ist = states('sensor.abkuehlrate_letzte_nacht_ist') | float(0) | abs %}
          {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(t_start) %}
          {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
          {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
          {% set faktor = ([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1 %}
          {% set G = lw * 4 / 12 * faktor %}
          {% set C = 40 %}
          {% set e_speicher = states('sensor.kachelofen_speicherenergie') | float(0) %}
          {% set P = e_speicher / h %}
          {% set t_eq = t_out + P / G %}
          {% set tau = C / G %}
          {% set t_19 = t_eq + (t_start - t_eq) * 2.71828 ** (-(h / tau)) %}
          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
          {{ [t_19, ziel + 5] | min | round(1) }}
        attributes:
          erstellt_um: "07:05 Uhr (nach Einfrieren der 07:00-Werte)"
          szenario: "kein weiterer Abbrand bis 19 Uhr - nur Ofen-Restwaerme"
          t_start: "{{ states('sensor.greenhouse_temperatur') | float(20) | round(1) }} °C"
          aussentemp_prognose_bis_19: "{{ states('sensor.vorhersage_bis_19_uhr_mittel') | float(0) | round(1) }} °C"
          speicherenergie: "{{ states('sensor.kachelofen_speicherenergie') | float(0) | round(1) }} kWh"
          abkuehlfaktor_letzte_nacht: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set rate_ist = states('sensor.abkuehlrate_letzte_nacht_ist') | float(0) | abs %}
            {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(21) %}
            {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
            {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
            {{ (([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1) | round(2) }}

  # =====================================================================
  # 11c. PROGNOSEFEHLER TAG (PROGNOSE VOM MORGEN VS. IST UM 18:55)
  # =====================================================================
  - trigger:
      - platform: time
        at: "19:05:00"
      - platform: state
        entity_id:
          - sensor.prognose_raumtemp_19_uhr_vom_morgen
    sensor:
      - name: "Prognosefehler Tag 19 Uhr"
        unique_id: vorhersagefehler_tag_19_uhr
        unit_of_measurement: "K"
        state_class: measurement
        availability: >-
          {{ has_value('sensor.prognose_raumtemp_19_uhr_vom_morgen')
             and has_value('sensor.raumtemperatur_vor_abendabbrand') }}
        state: >-
          {{ (states('sensor.raumtemperatur_vor_abendabbrand') | float(0)
              - states('sensor.prognose_raumtemp_19_uhr_vom_morgen') | float(0)) | round(1) }}
        attributes:
          bedeutung: "positiv = waermer als prognostiziert, negativ = kaelter"
          prognose_vom_morgen: "{{ states('sensor.prognose_raumtemp_19_uhr_vom_morgen') | float(0) | round(1) }} °C"
          ist_18_55: "{{ states('sensor.raumtemperatur_vor_abendabbrand') | float(0) | round(1) }} °C"
          morgen_abbrand_heute: "{{ states('sensor.morgen_abbrand_heute') }} (ja = heute vor 12 Uhr angezündet, Szenario 'kein weiterer Abbrand' verletzt - Fehler dann positiv verzerrt)"
          gueltig: >-
            {% set m = states('sensor.morgen_abbrand_heute') %}
            {% if m == 'nein' %}ja{% elif m == 'ja' %}nein{% else %}unbekannt{% endif %}

  # =====================================================================
  # 11d. MORGEN-ABBRAND HEUTE (JA/NEIN - ZUORDNUNG DES PROGNOSEFEHLERS)
  # =====================================================================
  - trigger:
      - platform: time
        at: "00:05:00"
      - platform: state
        entity_id: binary_sensor.kachelofen_zahler_ofen_brennt
        from: "off"
        to: "on"
    sensor:
      - name: "Morgen Abbrand heute"
        unique_id: morgen_abbrand_heute
        icon: mdi:fire-clock
        state: >-
          {% if trigger is defined and trigger.platform == 'time' %}
            nein
          {% elif trigger is defined and now().hour < 12 %}
            ja
          {% else %}
            {{ this.state }}
          {% endif %}

  # =====================================================================
  # 12. MORGENEMPFEHLUNG (NEU: energiebasiert bis 19 Uhr Abend-Abbrand)
  # =====================================================================
  - trigger:
      - platform: time_pattern
        minutes: "/30"
      - platform: state
        entity_id:
          - sensor.vorhersage_bis_19_uhr_mittel
          - sensor.abkuehlrate_nacht_ist
          - sensor.kachelofen_lernwert_kg_pro_grad
          - sensor.kachelofen_speicherenergie
          - sensor.vorhersagefehler_letzte_nacht
          - input_number.kachelofen_zieltemperatur
          - input_number.kachelofen_empfehlung_korrektur
          - input_select.kamin_holzart
    sensor:
      - name: "Kachelofen Morgenempfehlung Holzmenge"
        unique_id: kachelofen_morgen_holzmenge
        unit_of_measurement: "kg"
        icon: mdi:weather-sunset-up
        availability: >-
          {{ (now().hour == 7 or (now().hour == 8 and now().minute <= 30))
             and states('binary_sensor.kachelofen_zahler_ofen_brennt') == 'off' }}
        state: >-
          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
          {% set t_ist = states('sensor.greenhouse_temperatur') | float(21) %}
          {% set t_out = states('sensor.vorhersage_bis_19_uhr_mittel') | float(states('sensor.vorhersage_tag_mittel') | float(5)) + states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
          {% set h = [[19 - now().hour - now().minute / 60, 1] | max, 12] | min %}
          {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
          {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
          {% set lw = [lw, 0.6] | min %}
          {% set rate_ist = states('sensor.abkuehlrate_nacht_ist') | float(0) | abs %}
          {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(t_ist) %}
          {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
          {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
          {% set faktor = ([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1 %}
          {% set G = lw * 4 / 12 * faktor %}
          {% set verlust_kwh = G * ([ziel - t_out, 0] | max) * h %}
          {% set aufheiz_kg = 0.5 * ([ziel - t_ist, 0] | max) %}
          {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
          {% set rabatt_kg = [speicher_kwh / 4, 6] | min %}
          {% set kg_buche = verlust_kwh / 4 + aufheiz_kg - rabatt_kg + states('input_number.kachelofen_empfehlung_korrektur') | float(0) %}
          {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
          {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
          {% set kg_art = kg_buche * 4.0 / hw %}
          {{ [([(kg_art / 0.5) | round(0) * 0.5, 12] | min), 0] | max }}
        attributes:
          empfehlung: >-
            {% if this.state | float(0) > 0 %}ja{% else %}nein - keine Anzündung nötig{% endif %}
          begruendung: >-
            {% set t_ist = states('sensor.greenhouse_temperatur') | float(22) %}
            {% set t_out = states('sensor.vorhersage_bis_19_uhr_mittel') | float(states('sensor.vorhersage_tag_mittel') | float(5)) %}
            {% set h = [[19 - now().hour - now().minute / 60, 1] | max, 12] | min %}
            {% set stunden_seit = states('sensor.ofen_stunden_seit_abbrand') | float(24) %}
            {% if this.state | float(0) > 0 %}
              Bis 19 Uhr noch {{ h | round(1) }} h bei {{ t_out | round(1) }} °C Außentemperatur (Prognose), Raum aktuell {{ t_ist | round(1) }} °C{% if stunden_seit < 8 %} - Restwärme: erst {{ stunden_seit | round(1) }} h seit letztem Abbrand{% endif %}
            {% else %}
              Kein Bedarf: {{ t_ist | round(1) }} °C im Raum, Prognose bis 19 Uhr {{ t_out | round(1) }} °C
            {% endif %}
          lernwert_verwendet: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {{ lw | round(2) }} kg/K
          abkuehlfaktor_letzte_nacht: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set rate_ist = states('sensor.abkuehlrate_nacht_ist') | float(0) | abs %}
            {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(21) %}
            {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
            {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
            {{ (([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1) | round(2) }} (gemessene vs. modellierte Abkühlrate der letzten Nacht)
          verlustbeiwert: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set rate_ist = states('sensor.abkuehlrate_nacht_ist') | float(0) | abs %}
            {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(21) %}
            {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
            {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
            {% set faktor = ([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1 %}
            {{ (lw * 4 / 12 * faktor) | round(3) }} kW/K
          verlustenergie_bis_19: >-
            {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
            {% set t_out = states('sensor.vorhersage_bis_19_uhr_mittel') | float(states('sensor.vorhersage_tag_mittel') | float(5)) + states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set h = [[19 - now().hour - now().minute / 60, 1] | max, 12] | min %}
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set rate_ist = states('sensor.abkuehlrate_nacht_ist') | float(0) | abs %}
            {% set t_vor = states('sensor.raumtemperatur_vor_abbrand') | float(21) %}
            {% set t_out_nacht = states('sensor.aussentemperatur_letzte_nacht_ist') | float(0) %}
            {% set rate_modell = lw * 4 * ([t_vor - t_out_nacht, 1] | max) / 480 %}
            {% set faktor = ([[rate_ist / rate_modell, 0.5] | max, 2] | min) if rate_modell > 0 and rate_ist > 0 else 1 %}
            {% set G = lw * 4 / 12 * faktor %}
            {{ (G * ([ziel - t_out, 0] | max) * h) | round(1) }} kWh
          aufheizbedarf: "{{ (0.5 * ([states('input_number.kachelofen_zieltemperatur') | float(21) - states('sensor.greenhouse_temperatur') | float(22), 0] | max)) | round(1) }} kg"
          speicherrest: "{{ states('sensor.kachelofen_speicherenergie') | float(0) | round(1) }} kWh"
          rabatt_durch_speicher: "{{ ([states('sensor.kachelofen_speicherenergie') | float(0) / 4, 6] | min) | round(1) }} kg"
          aussentemp_prognose_bis_19: "{{ states('sensor.vorhersage_bis_19_uhr_mittel') | float(0) | round(1) }} °C"
          stunden_bis_19: "{{ [[19 - now().hour - now().minute / 60, 1] | max, 12] | min | round(1) }} h"
          holzart: "{{ states('input_select.kamin_holzart') | default('Buche', true) }}"
          heizwert: >
            {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
            {{ {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) }} kWh/kg
  # =====================================================================
  # 13. VORHERSAGE (NACHT & TAG)
  # =====================================================================
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        hours: "/1"
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.attenkam
        data:
          type: hourly
        response_variable: fc
    sensor:
      - name: "Vorhersage Nacht Mittel"
        unique_id: vorhersage_nacht_mittel
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:weather-night
        availability: >
          {% set fc = fc['weather.attenkam'].forecast %}
          {% set ns = namespace(werte=[]) %}
          {% for eintrag in fc %}
            {% set ts = eintrag.datetime | as_datetime | as_local %}
            {% if ts.hour >= 19 or ts.hour < 7 %}
              {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
            {% endif %}
          {% endfor %}
          {{ ns.werte | length > 0 }}
        state: >
          {% set fc = fc['weather.attenkam'].forecast %}
          {% set ns = namespace(werte=[]) %}
          {% for eintrag in fc %}
            {% set ts = eintrag.datetime | as_datetime | as_local %}
            {% if ts.hour >= 19 or ts.hour < 7 %}
              {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
            {% endif %}
          {% endfor %}
          {{ (ns.werte | sum / ns.werte | length) | round(1) }}
        attributes:
          nacht_tiefstwert: >
            {% set fc = fc['weather.attenkam'].forecast %}
            {% set ns = namespace(werte=[]) %}
            {% for eintrag in fc %}
              {% set ts = eintrag.datetime | as_datetime | as_local %}
              {% if ts.hour >= 19 or ts.hour < 7 %}
                {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
              {% endif %}
            {% endfor %}
            {% if ns.werte | length > 0 %}
              {{ ns.werte | min | round(1) }} °C
            {% endif %}
          zuletzt_aktualisiert: "{{ now().strftime('%H:%M') }} Uhr"

      - name: "Vorhersage Tag Mittel"
        unique_id: vorhersage_tag_mittel
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:weather-sunny
        state: >
          {% set fc = fc['weather.attenkam'].forecast %}
          {% set ns = namespace(werte=[]) %}
          {% for eintrag in fc %}
            {% set ts = eintrag.datetime | as_datetime | as_local %}
            {% if ts.hour >= 7 and ts.hour < 19 %}
              {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
            {% endif %}
          {% endfor %}
          {% if ns.werte | length > 0 %}
            {{ (ns.werte | sum / ns.werte | length) | round(1) }}
          {% else %}
            {{ states('sensor.gw3000a_outdoor_temperature') | float(0) | round(1) }}
          {% endif %}

      - name: "Vorhersage bis 19 Uhr Mittel"
        unique_id: vorhersage_bis_19_uhr_mittel
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:weather-sunset-down
        state: >
          {% set fc = fc['weather.attenkam'].forecast %}
          {% set ns = namespace(werte=[]) %}
          {% for eintrag in fc %}
            {% set ts = eintrag.datetime | as_datetime | as_local %}
            {% if ts.date() == now().date() and ts.hour >= now().hour and ts.hour < 19 %}
              {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
            {% endif %}
          {% endfor %}
          {% if ns.werte | length > 0 %}
            {{ (ns.werte | sum / ns.werte | length) | round(1) }}
          {% else %}
            {{ states('sensor.vorhersage_tag_mittel') | float(states('sensor.gw3000a_outdoor_temperature') | float(5)) | round(1) }}
          {% endif %}
        attributes:
          tiefstwert_bis_19: >
            {% set fc = fc['weather.attenkam'].forecast %}
            {% set ns = namespace(werte=[]) %}
            {% for eintrag in fc %}
              {% set ts = eintrag.datetime | as_datetime | as_local %}
              {% if ts.date() == now().date() and ts.hour >= now().hour and ts.hour < 19 %}
                {% set ns.werte = ns.werte + [eintrag.temperature | float] %}
              {% endif %}
            {% endfor %}
            {% if ns.werte | length > 0 %}
              {{ ns.werte | min | round(1) }} °C
            {% endif %}
          zuletzt_aktualisiert: "{{ now().strftime('%H:%M') }} Uhr"

  # =====================================================================
  # 14. HOLZMENGEN-EMPFEHLUNGEN (Alle korrigiert)
  # =====================================================================
  - sensor:
      # --- Kalibrierte Empfehlung ---
      - name: "Kachelofen Holzmenge Empfehlung Kalibriert"
        unique_id: kachelofen_holz_empfehlung_kalibriert
        unit_of_measurement: "kg"
        icon: mdi:fire-circle
        availability: >
          {{ has_value('sensor.vorhersage_nacht_mittel') }}
        state: >
          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
          {% set tin = [states('sensor.greenhouse_temperatur') | float(22), ziel] | min %}
          {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(nan) %}
          {% if nacht_prognose != nacht_prognose %}
            {{ 'keine Vorhersage' }}
          {% else %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set nacht_effektiv = nacht_prognose + fehler %}
            {% set diff = [tin - nacht_effektiv, 0] | max %}
            {% set kg_buche = 4 + 0.6 * diff + states('input_number.kachelofen_empfehlung_korrektur') | float(0) %}
            {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
            {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
            {% set kg_art = kg_buche * 4.0 / hw %}
            {{ [(kg_art / 0.5) | round(0) * 0.5, 0] | max }}
          {% endif %}
        attributes:
          nacht_prognose: "{{ states('sensor.vorhersage_nacht_mittel') }} °C"
          nacht_korrigiert: >
            {{ (states('sensor.vorhersage_nacht_mittel') | float(0)
                + states('sensor.vorhersagefehler_letzte_nacht') | float(0)) | round(1) }} °C
          feinkorrektur: "{{ states('input_number.kachelofen_empfehlung_korrektur') }} kg"

  - trigger:
      - platform: time_pattern
        minutes: "/30"
      - platform: state
        entity_id:
          - sensor.vorhersage_nacht_mittel
          - sensor.vorhersagefehler_letzte_nacht
          - sensor.kachelofen_lernwert_kg_pro_grad
          - sensor.kachelofen_speicherenergie
          - input_number.kachelofen_zieltemperatur
          - input_number.kachelofen_empfehlung_korrektur
          - input_select.kamin_holzart
    sensor:
      - name: "Kachelofen Holzmenge Empfehlung Gelernt"
        unique_id: kachelofen_holzmenge_empfehlung_gelernt
        unit_of_measurement: "kg"
        icon: mdi:fire-circle
        state: >-
          {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
          {% set lw = [lernwert, 0.5] | max %}
          {% set lw = [lw, 0.6] | min %}

          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22.5) %}
          {% set tin = [states('sensor.greenhouse_temperatur') | float(21), ziel] | min %}

          {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(10) %}
          {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
          {% set nacht_effektiv = nacht_prognose + fehler %}

          {% set diff = [tin - nacht_effektiv, 0] | max %}

          {% set grundbedarf = 6 %}
          {% set kg_buche = grundbedarf + lw * diff + (states('input_number.kachelofen_empfehlung_korrektur') | float(0)) %}

          {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
          {% set speicher_kg = [speicher_kwh / 4, 6] | min %}
          {% set kg_buche = [kg_buche - speicher_kg, 0] | max %}

          {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
          {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
          {% set kg_art = kg_buche * 4.0 / hw %}

          {{ [(kg_art / 0.5) | round(0) * 0.5, 0.5] | max }}
        attributes:
          # --- lernwert_verwendet ---
          lernwert_verwendet: >-
            {% set lw = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0) %}
            {{ (lw if 0.5 <= lw <= 1.5 else 'Faustwert 0.6 (Lernwert außerhalb 0.5-1.5)') }}

          # --- nacht_effektiv ---
          nacht_effektiv: >-
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(10) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {{ (nacht_prognose + fehler) | round(1) }} °C

          # --- grundbedarf ---
          grundbedarf: "{{ 8 }} kg (Basis für 12h bei 21°C Raumtemperatur)"

          # --- diff_temperatur (JEDE VARIABLE NEU DEFINIERT!) ---
          diff_temperatur: >-
            {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(21) %}
            {% set tin = [states('sensor.greenhouse_temperatur') | float(20), ziel] | min %}
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(10) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set nacht_effektiv = nacht_prognose + fehler %}
            {% set diff = [tin - nacht_effektiv, 0] | max %}
            {{ diff | round(1) }} K

          # --- speicher_abzug (JEDE VARIABLE NEU DEFINIERT!) ---
          speicher_abzug: >-
            {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
            {% set speicher_kg = [speicher_kwh / 4, 6] | min %}
            {{ speicher_kg | round(1) }} kg

          # --- berechnung (JEDE VARIABLE NEU DEFINIERT!) ---
          berechnung: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
            {% set lw = [lernwert, 0.5] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(21) %}
            {% set tin = [states('sensor.greenhouse_temperatur') | float(20), ziel] | min %}
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(10) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set nacht_effektiv = nacht_prognose + fehler %}
            {% set diff = [tin - nacht_effektiv, 0] | max %}
            {% set grundbedarf = 6 %}
            {% set kg_buche = grundbedarf + lw * diff + (states('input_number.kachelofen_empfehlung_korrektur') | float(0)) %}
            {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
            {% set speicher_kg = [speicher_kwh / 4, 6] | min %}
            {% set kg_buche = [kg_buche - speicher_kg, 0] | max %}
            Grundbedarf (8 kg) + Lernwert ({{ lw | round(2) }}) × Temperaturdifferenz ({{ diff | round(1) }} K) = {{ (8 + lw * diff) | round(1) }} kg Buche - Speicherabzug ({{ speicher_kg | round(1) }} kg) = {{ kg_buche | round(1) }} kg Buche

          # --- empfehlung_text (JEDE VARIABLE NEU DEFINIERT!) ---
          empfehlung_text: >-
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
            {% set lw = [lernwert, 0.5] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(21) %}
            {% set tin = [states('sensor.greenhouse_temperatur') | float(20), ziel] | min %}
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(10) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set nacht_effektiv = nacht_prognose + fehler %}
            {% set diff = [tin - nacht_effektiv, 0] | max %}
            {% set grundbedarf = 6 %}
            {% set kg_buche = grundbedarf + lw * diff + (states('input_number.kachelofen_empfehlung_korrektur') | float(0)) %}
            {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
            {% set speicher_kg = [speicher_kwh / 4, 6] | min %}
            {% set kg_buche = [kg_buche - speicher_kg, 0] | max %}
            {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
            {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
            {% set kg_art = kg_buche * 4.0 / hw %}
            {% if kg_art > 0 %}
              Verbrenne {{ [(kg_art / 0.5) | round(0) * 0.5, 0.5] | max }} kg {{ art }} für die nächste Nacht ({{ nacht_effektiv | round(1) }} °C).
            {% else %}
              Kein Holz nötig – Speicher reicht aus ({{ speicher_kwh | round(1) }} kWh).
            {% endif %}

      # --- Lernend Empfehlung ---
      - name: "Kachelofen Holzmenge Empfehlung (lernend)"
        unique_id: kachelofen_holzmenge_empfehlung_lernend
        unit_of_measurement: "kg"
        state_class: measurement
        icon: mdi:fire-circle
        availability: >-
          {{ has_value('input_number.kachelofen_lernfaktor_kg_pro_grad')
             and has_value('input_number.kachelofen_zieltemperatur') }}
        state: >-
          {% set ziel = states('input_number.kachelofen_zieltemperatur') | float(22) %}
          {% set t_ist = states('sensor.greenhouse_temperatur') | float(21) %}
          {% set lernfaktor = states('input_number.kachelofen_lernfaktor_kg_pro_grad') | float(0.6) %}
          {% set fehlt = [ziel - t_ist, 0] | max %}
          {% set kg = (fehlt + 0.5) * lernfaktor %}
          {% set kg_gerundet = ((kg + 0.25) / 0.5) | round(0) * 0.5 %}
          {{ [kg_gerundet, 0.5] | max }}

      # --- Basis Empfehlung ---
      - name: "Kachelofen Holzmenge Empfehlung"
        unique_id: kachelofen_holz_empfehlung
        unit_of_measurement: "kg"
        icon: mdi:fire-alert
        availability: >
          {{ has_value('sensor.vorhersage_nacht_mittel') }}
        state: >
          {% set tin = states('sensor.greenhouse_temperatur') | float(21) %}
          {% set nacht_mittel = states('sensor.vorhersage_nacht_mittel') | float(nan) %}
          {% if nacht_mittel != nacht_mittel %}
            {{ 'keine Vorhersage' }}
          {% else %}
            {% set diff = [tin - nacht_mittel, 0] | max %}
            {% set kg_buche = 4 + 0.6 * diff %}
            {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
            {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
            {% set kg_art = kg_buche * 4.0 / hw %}
            {{ (kg_art / 0.5) | round(0) * 0.5 }}
          {% endif %}
        attributes:
          energiebedarf_kwh: >
            {% set tin = states('sensor.greenhouse_temperatur') | float(22.5) %}
            {% set nacht_mittel = states('sensor.vorhersage_nacht_mittel') | float(0) %}
            {% set diff = [tin - nacht_mittel, 0] | max %}
            {{ ((4 + 0.6 * diff) * 4.0) | round(1) }}
          holzart: "{{ states('input_select.kamin_holzart') }}"

  # =====================================================================
  # 15. 19:00 UHR EMPFEHLUNG (ANGEPASST)
  # =====================================================================
  - trigger:
      - platform: time_pattern
        minutes: "/15"
    sensor:
      - name: "Holzmenge für 22°C morgen 07:00 (19:00 Abbrand)"
        unique_id: holzmenge_19_uhr_fuer_22_grad_morgen
        unit_of_measurement: "kg"
        icon: mdi:fire
        availability: >-
          {{ has_value('sensor.vorhersage_nacht_mittel')
             and has_value('sensor.vorhersagefehler_letzte_nacht')
             and has_value('sensor.kachelofen_speicherenergie')
             and has_value('sensor.kachelofen_lernwert_kg_pro_grad')
             and has_value('input_select.kamin_holzart') }}
        state: >-
          {% set ziel = 22.0 %}
          {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
          {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
          {% set lw = [lw, 0.6] | min %}
          {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(5) %}
          {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
          {% set nacht_effektiv = nacht_prognose + fehler %}
          {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
          {% set diff = [ziel - nacht_effektiv, 0] | max %}
          {% set grundbedarf = 6 + lw * diff %}
          {% set energie_benoetigt = grundbedarf * 4.0 %}
          {% set energie_fehlend = [energie_benoetigt - speicher_kwh, 0] | max %}
          {% set kg_buche = energie_fehlend / 4.0 %}
          {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
          {% set hw = {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) %}
          {% set kg_art = kg_buche * 4.0 / hw %}
          {{ [((kg_art + 0.25) / 0.5) | round(0) * 0.5, 0.5] | max }}
        attributes:
          ziel_temperatur: "22.0 °C"
          nacht_prognose: >
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(5) %}
            {{ nacht_prognose | round(1) }} °C
          nacht_effektiv: >
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(5) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {{ (nacht_prognose + fehler) | round(1) }} °C
          speicherenergie: >
            {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
            {{ speicher_kwh | round(1) }} kWh
          energie_benoetigt: >
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(5) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set diff = [22.0 - nacht_prognose - fehler, 0] | max %}
            {{ ((8 + lw * diff) * 4.0) | round(1) }} kWh
          energie_fehlend: >
            {% set lernwert = states('sensor.kachelofen_lernwert_kg_pro_grad') | float(0.6) %}
            {% set lw = 0.6 if lernwert <= 0 else [lernwert, 0.15] | max %}
            {% set lw = [lw, 0.6] | min %}
            {% set nacht_prognose = states('sensor.vorhersage_nacht_mittel') | float(5) %}
            {% set fehler = states('sensor.vorhersagefehler_letzte_nacht') | float(0) %}
            {% set diff = [22.0 - nacht_prognose - fehler, 0] | max %}
            {% set energie_benoetigt = (8 + lw * diff) * 4.0 %}
            {% set speicher_kwh = states('sensor.kachelofen_speicherenergie') | float(0) %}
            {{ [energie_benoetigt - speicher_kwh, 0] | max | round(1) }} kWh
          holzart: "{{ states('input_select.kamin_holzart') | default('Buche', true) }}"
          heizwert: >
            {% set art = states('input_select.kamin_holzart') | default('Buche', true) %}
            {{ {'Buche': 4.0, 'Eiche': 4.0, 'Esche': 4.0, 'Birke': 4.1, 'Fichte': 4.3, 'Kiefer': 4.3}.get(art, 4.0) }} kWh/kg

